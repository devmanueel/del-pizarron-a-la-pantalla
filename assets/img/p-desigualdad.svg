<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="Dos personas con distinto acceso a internet">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0a2a5c"/>
      <stop offset="1" stop-color="#031437"/>
    </radialGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe0ff"/>
      <stop offset="1" stop-color="#2aa4e0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="520" height="520" fill="url(#bg)"/>
  <!-- grid dots -->
  <g fill="#1d4a86" opacity=".6">
    <circle cx="40" cy="40" r="2"/><circle cx="70" cy="40" r="2"/><circle cx="100" cy="40" r="2"/>
    <circle cx="40" cy="70" r="2"/><circle cx="70" cy="70" r="2"/><circle cx="100" cy="70" r="2"/>
    <circle cx="420" cy="460" r="2"/><circle cx="450" cy="460" r="2"/><circle cx="480" cy="460" r="2"/>
    <circle cx="420" cy="430" r="2"/><circle cx="450" cy="430" r="2"/><circle cx="480" cy="430" r="2"/>
  </g>
  <!-- ground platforms: uneven -->
  <rect x="40" y="330" width="200" height="120" rx="10" fill="#0e3570" stroke="#3fb8f0" stroke-width="2"/>
  <rect x="280" y="400" width="200" height="50" rx="10" fill="#0b2a58" stroke="#2b6aa8" stroke-width="2"/>
  <!-- left person -->
  <g transform="translate(140 250)">
    <circle cx="0" cy="-60" r="26" fill="#9fdcff"/>
    <path d="M-42 75 Q-40 -20 0 -24 Q40 -20 42 75 Z" fill="#2f8fd6"/>
    <rect x="-46" y="20" width="92" height="56" rx="6" fill="#0b1f45" stroke="url(#cy)" stroke-width="4"/>
    <rect x="-38" y="28" width="76" height="40" rx="3" fill="#123a78"/>
    <path d="M-30 40 h40 M-30 50 h56 M-30 60 h30" stroke="#7fe0ff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- strong wifi -->
  <g transform="translate(140 120)" fill="none" stroke="url(#cy)" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
    <path d="M-60 -10 Q0 -60 60 -10"/>
    <path d="M-40 10 Q0 -25 40 10"/>
    <path d="M-20 30 Q0 15 20 30"/>
    <circle cx="0" cy="46" r="7" fill="#7fe0ff" stroke="none"/>
  </g>
  <!-- right person -->
  <g transform="translate(380 320)">
    <circle cx="0" cy="-60" r="26" fill="#c9b48a"/>
    <path d="M-42 75 Q-40 -20 0 -24 Q40 -20 42 75 Z" fill="#6b5a3a"/>
    <rect x="-22" y="14" width="44" height="70" rx="8" fill="#1a1a2e" stroke="#8a7a5a" stroke-width="4"/>
    <rect x="-15" y="22" width="30" height="48" rx="3" fill="#2a2a40"/>
  </g>
  <!-- weak / crossed wifi -->
  <g transform="translate(380 175)" fill="none" stroke-linecap="round">
    <path d="M-60 -10 Q0 -60 60 -10" stroke="#3a4a66" stroke-width="9"/>
    <path d="M-40 10 Q0 -25 40 10" stroke="#3a4a66" stroke-width="9"/>
    <path d="M-20 30 Q0 15 20 30" stroke="#FFB547" stroke-width="9"/>
    <circle cx="0" cy="46" r="7" fill="#FFB547"/>
    <path d="M-50 -40 L50 60" stroke="#ff6b5b" stroke-width="10" filter="url(#glow)"/>
  </g>
  <!-- gap arrow -->
  <g stroke="#FFB547" stroke-width="4" fill="none" stroke-dasharray="8 8">
    <path d="M250 300 L270 300"/>
  </g>
  <g fill="#FFB547">
    <path d="M248 470 h24 v-46 h14 l-26 -30 -26 30 h14 z" opacity=".95"/>
  </g>
</svg>
